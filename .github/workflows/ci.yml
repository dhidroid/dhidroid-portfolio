name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Portfolio app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Lint changed source files
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only -z --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx'
          )
          if ((${#files[@]})); then
            npx eslint "${files[@]}"
          else
            echo "No changed JavaScript or TypeScript source files to lint."
          fi

      - name: Build portfolio
        run: npm run build

  studio:
    name: Sanity Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sanity-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: sanity-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Build Sanity Studio
        run: npm run build
